[project]
name = "construction-evidence-service"
version = "0.1.0"
requires-python = "==3.13.15"
dependencies = [
  "fastapi==0.141.1",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.3",
  "alembic==1.17.2",
  "boto3==1.42.73",
  "uvicorn==0.41.0",
  "pillow==12.1.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[project.scripts]
evidence-service = "app.main:serve"
evidence-profile = "app.application.deepseek_runtime:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
